<!-- index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>34 Hour Reset Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style type="text/css"></style>
</head>

<body>

    <div class="container py-4">
        <div class="row">
            <div class="col-12">
                <label for="start" class="form-label fs-5 fw-bold">Reset Start:</label>
                <input type="datetime-local" id="start" class="form-control form-control-lg">
            </div>
        </div>

        <div class="row">
            <div class="col-6">
                <button id="nowBtn" class="btn btn-primary w-100">Start Reset Now</button>
            </div>
            <div class="col-6">
                <button id="calcBtn" class="btn btn-primary w-100">Calculate</button>
            </div>
        </div>

        <div id="resultContainer" class="row mt-4">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="text-secondary">
                            Reset Started:
                        </h5>
                        <div id="startTime" class="fs-5 mb-4"></div>
                    </div>
                </div>
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="text-secondary">
                            34-Hour Reset Complete:
                        </h5>
                        <div id="result" class="display-6 fw-bold text-success">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>

    <script src="34hr_reset_calculator.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
