<!-- 34hr_reset_calculator.htm -->
<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        34hr Reset Calculator
    </title>
    <style>
        input,
        button {
            font-size: 20px;
            padding: 12px;
            margin: 8px 4px;
        }

        button {
            min-height: 50px;
        }

        input[type="datetime-local"] {
            min-height: 50px;
        }

        label {
            font-size: 24px;
            margin-right: 12px;
        }

        #resultContainer {
            margin-top: 15px;
        }

        #startTime,
        #result {
            margin-top: 10px;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <label for="start">Reset Start:</label>
    <input type="datetime-local" id="start">

    <button id="nowBtn">Start Reset Now</button>
    <button id="calcBtn">Calculate</button>

    <div id="resultContainer">
        <div id="startTime"></div>
        <div id="result"></div>
    </div>

    <script src="34hr_reset_calculator.js"></script>
</body>

</html>
